    "/OAuth2/Authorize/{app_id}" : {
      "post" : {
        "tags" : [ "OAuth & OpenID Connect" ],
        "summary" : "Authorize",
        "description" : "<li>The authorize API is used to send an authorization and authentication request to CyberArk Identity.</li>             <li>CyberArk Identity authenticates the user and returns authorization code/tokens based on the grant type to the client application as a part of the callback response.</li>                       <li>Refer to the guides<a href=\"https://identity-developer.cyberark.com/docs/oidc-authentication\">OpenID Connect</a> and \n <a href=\"https://identity-developer.cyberark.com/docs/oauth\">OAuth 2.0</a> for more information</li>  ",
        "parameters" : [ {
          "name" : "app_id",
          "in" : "path",
          "description" : "The application ID of the Open ID connect custom web app",
          "required" : true,
          "style" : "simple",
          "explode" : false,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "scope",
          "in" : "query",
          "description" : "The scopes for which the authorization is requested. The scopes can be space separated. The scopes can be used to define the  <a href=\"https://identity-developer.cyberark.com/docs/api-scopes\"> APIs </a> and the <a href=\"https://identity-developer.cyberark.com/docs/claims\"> claims </a>  information that the client application can access. <b>Note:</b> 'OpenID' scope is required to get ID token.",
          "required" : true,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "redirect_uri",
          "in" : "query",
          "description" : "The callback URI to which the user gets redirected along with the authorization code or tokens. The redirect URI must be in the list of authorized redirect URIs.",
          "required" : true,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "prompt",
          "in" : "query",
          "description" : "Space delimited, case-sensitive list of ASCII string values that specifies whether the authorization server prompts the End-User for reauthentication and consent. \nCyberArk Identity supports the following values:\n  1. <b>none</b>: An error is returned if an End-User is not already authenticated.\n  2. <b>login</b>: CyberArk Identity prompts the End-User for reauthentication. If the user cannot be reauthenticated, an error is returned.\n",
          "required" : false,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "code_challenge_method",
          "in" : "query",
          "description" : "The method used to derive the ‘code challenge’ using the ‘code verifier.’ This param is only applicable for PKCE flow.",
          "required" : false,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          },
          "example" : "SHA256"
        }, {
          "name" : "code_challenge",
          "in" : "query",
          "description" : "It is derived from the <a href=\"https://identity-developer.cyberark.com/docs/authorization-code-flow-with-pkce#code-verifier-and-code-challenge\">code verifier</a>.  This param is only applicable for PKCE flow.",
          "required" : false,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "client_id",
          "in" : "query",
          "description" : "The client ID is the unique ID that CyberArk Identity issues to the client application.",
          "required" : true,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          },
          "example" : "90ab28fc-f890-4b3d-9c44-722c9b6ecf2"
        }, {
          "name" : "client_secret",
          "in" : "query",
          "description" : "A unique code that an authorization service issues when the service registers the application.  You can think of it as the password for the client application.",
          "required" : false,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "response_type",
          "in" : "query",
          "description" : "The response type determines the grant type of OAuth / OpenID Connect. CyberArk Identity supports the following grant types: \n  <b>1. Authorization code flow (with/without PKCE):</b> code  \n  <b>2. Implicit flow:</b> id_token; token id_token  \n  <b>3. Hybrid flow:</b> code token id_token; code token; code id_token\n",
          "required" : true,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        }, {
          "name" : "state",
          "in" : "query",
          "description" : "The Client should use the content of this parameter to make sure the Code it received matches the authorization request it sent.",
          "required" : false,
          "style" : "form",
          "explode" : true,
          "schema" : {
            "type" : "string"
          }
        } ],
        "responses" : {
          "302" : {
            "description" : "Successful redirect with authorization code or tokens",
            "content" : {
              "*/*" : {
                "schema" : {
                  "$ref" : "#/components/schemas/inline_response_302"
                }
              }
            }
          },
          "400" : {
